<title>행사 큐시트 프로그램</title>

<script>
  // 로컬 미리보기나 빌드가 생략된 배포에서도 브라우저에는 현재 주소를 반영합니다.
  // Netlify 정식 빌드에서는 서버가 읽는 OG 태그까지 절대주소로 자동 변환됩니다.
  (() => {
    if (!/^https?:$/.test(location.protocol)) return;
    const pageUrl = new URL('/', location.origin).href;
    const imageUrl = new URL('/og-thumbnail-v1.5.jpg', location.origin).href;
    const set = (selector, value) => {
      const el = document.querySelector(selector);
      if (el) el.setAttribute('content', value);
    };
    set('meta[property="og:image"]', imageUrl);
    set('meta[property="og:image:secure_url"]', imageUrl);
    set('meta[name="twitter:image"]', imageUrl);
    set('meta[property="og:url"]', pageUrl);
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.setAttribute('href', pageUrl);
  })();
</script>
<script>
  // 주소 끝에 ?reset=1을 붙이면 이전 서비스워커·오프라인 캐시만 정리합니다.
  // 행사 편집 내용(localStorage)은 삭제하지 않습니다.
  (async () => {
    if (!new URLSearchParams(location.search).has('reset')) return;
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg => reg.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    } catch (_) {}
    history.replaceState(null, '', location.pathname);
    location.reload();
  })();
</script>
</head>

<div id="root"></div>
<div class="modal-backdrop" id="modal"><div class="modal" id="modalBody"></div></div>

<script defer src="/assets/app-v1.8.1.js"></script>
</body>
